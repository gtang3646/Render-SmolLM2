user root;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 64;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # API Key 验证（从环境变量注入）
    map $http_authorization $api_key_valid {
        default 0;
        "Bearer __API_KEY__" 1;
    }

    # 限流保护（低内存环境）
    limit_req_zone $binary_remote_addr zone=api:1m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=addr:1m;

    server {
        listen 10000;
        server_name localhost;

        # 增加缓冲区大小以处理大请求体
        client_body_buffer_size 16k;
        client_max_body_size 1m;

        # 健康检查端点（无需认证，Render 需要）
        location /health {
            access_log off;
            return 200 '{"status":"ok","model":"SmolLM2-135M-Instruct"}';
            add_header Content-Type application/json;
        }

        # 根路径重定向到健康检查
        location = / {
            return 302 /health;
        }

        # OpenAI 兼容 API 端点
        location /v1/ {
            # API Key 验证
            if ($api_key_valid = 0) {
                return 401 '{"error":{"message":"Invalid or missing API key","type":"authentication_error","code":"invalid_api_key"}}';
            }

            # 限流保护
            limit_req zone=api burst=2 nodelay;
            limit_conn addr 1;

            proxy_pass http://127.0.0.1:8080/v1/;
            proxy_http_version 1.1;
            
            # 关键头部
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 超时设置（生成可能较慢）
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            
            # 缓冲区优化（低内存）
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 2 4k;
            proxy_busy_buffers_size 8k;

            # 流式响应支持
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        # 拒绝其他路径
        location / {
            return 404 '{"error":{"message":"Not found","type":"invalid_request_error"}}';
        }
    }
}
